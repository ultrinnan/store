# Production additions (VPS). Loaded via the docker-compose.override.yml symlink
# on the server, or explicitly: docker compose -f docker-compose.yml -f docker-compose.prod.yml ...
services:
  db:
    deploy:
      resources:
        limits:
          memory: 768m

  wordpress:
    deploy:
      resources:
        limits:
          memory: 1500m
    networks:
      - default
      - traefik-public
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-public"
      - "traefik.http.routers.veldrin.rule=Host(`veldrin.store`)"
      - "traefik.http.routers.veldrin.entrypoints=websecure"
      - "traefik.http.routers.veldrin.tls=true"
      - "traefik.http.routers.veldrin.tls.certresolver=le"
      - "traefik.http.services.veldrin.loadbalancer.server.port=80"

networks:
  traefik-public:
    external: true
